name: Build

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main
      - '*'

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
    run:
        shell: bash {0}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

#
# Prepare environment with necessary packages.
# disabled for now, uncomment if need to install package
#    - name: Setup Requirements
#      run: |
#        sudo apt-get install mingw-w64

    - name: Checkout
      uses: actions/checkout@v5

#
# Cache LwTools, if no cache key entry exists a new one will be created upon a successful build.
# This will store the entries in 'path:' in a zip file, conveniently they all start with 'lw'
#
    - name: Cache LwTools
      id: cache-lwtools
      uses: actions/cache@v5
      env:
        cache-name: cache-lwtools
      with:
        path: /usr/local/bin/lw*
        key: lwtools-4.24

#
# Fetch toolshed from the official repo. `latest: true` used to correctly
# resolve to the CLI toolset release (the only kind that used to exist),
# but nitros9project/toolshed now also publishes a separate "DiskShed" GUI
# app as its own release -- DiskShed-v0.9.0 was published a couple hours
# after the real CLI release (v2.6.0) on the same day, so GitHub's own
# "latest" release pointer moved to DiskShed, which packages only a
# DiskShed GUI binary (no os9/dcheck/rbfformat/etc. at all) and doesn't
# even publish a toolshed-unix*.tgz asset. Pin to the known-good CLI
# release explicitly instead of trusting "latest" to mean what it used
# to; same reasoning as this workflow's own LwTools version pin below.
#
    - name: Fetch Toolshed
      uses: robinraju/release-downloader@v1
      with:
        repository: nitros9project/toolshed
        tag: v2.6.0
        fileName: toolshed-unix*.tgz
        out-file-path: toolshed

#
# Unzip fetched toolshed binaries directly into /usr/local/bin
#

    - name: Install Toolshed
      run: |
        sudo tar xvf toolshed/toolshed-unix*.tgz --strip-components=1 -C /usr/local/bin

#
# If LwTools was cached last time, we can skip this step.
# otherwise fetch it, build and install to /usr/local/bin.
#
    - if: ${{ steps.cache-lwtools.outputs.cache-hit != 'true' }}
      name: Install Lwtools
      run: |
        sudo bash ./.github/workflows/lwtools.sh

#
# Trial build all nitros9 targets.
#
    - name: Build NitrOS9
      run: |
        sudo bash ./.github/workflows/nitros9.sh
      

