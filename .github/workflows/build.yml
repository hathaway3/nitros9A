name: Build

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main
      - '*'

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
    run:
        shell: bash {0}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

#
# Prepare environment with necessary packages.
# disabled for now, uncomment if need to install package
#    - name: Setup Requirements
#      run: |
#        sudo apt-get install mingw-w64

    - name: Checkout
      uses: actions/checkout@v5

#
# Cache LwTools, if no cache key entry exists a new one will be created upon a successful build.
# This will store the entries in 'path:' in a zip file, conveniently they all start with 'lw'
#
    - name: Cache LwTools
      id: cache-lwtools
      uses: actions/cache@v5
      env:
        cache-name: cache-lwtools
      with:
        path: /usr/local/bin/lw*
        key: lwtools-4.24

#
# Fetch latest toolshed from the official repo. The upstream release used
# to ship a toolshed-unix*.tgz tarball; as of DiskShed-v0.9.0 the Linux
# asset is an AppImage instead (toolshed-unix*.tgz no longer exists in any
# release asset, which silently broke this whole job -- every run failed
# in this one step, before ever reaching the actual nitros9 build).
#
    - name: Fetch Toolshed
      uses: robinraju/release-downloader@v1
      with:
        repository: nitros9project/toolshed
        fileName: "*-linux-x86_64.AppImage"
        latest: true
        extract: false
        out-file-path: toolshed

#
# AppImages bundle their own squashfs payload; --appimage-extract unpacks
# it into ./squashfs-root without needing FUSE (which GitHub-hosted
# runners don't have) -- this only works run *as* the AppImage itself, on
# the matching Linux platform, which is exactly what this runner is.
#
    - name: Install Toolshed
      run: |
        chmod +x toolshed/*-linux-x86_64.AppImage
        ( cd toolshed && ./*-linux-x86_64.AppImage --appimage-extract )
        find toolshed/squashfs-root/usr/bin -maxdepth 1 -type f
        sudo cp -a toolshed/squashfs-root/usr/bin/. /usr/local/bin/

#
# If LwTools was cached last time, we can skip this step.
# otherwise fetch it, build and install to /usr/local/bin.
#
    - if: ${{ steps.cache-lwtools.outputs.cache-hit != 'true' }}
      name: Install Lwtools
      run: |
        sudo bash ./.github/workflows/lwtools.sh

#
# Trial build all nitros9 targets.
#
    - name: Build NitrOS9
      run: |
        sudo bash ./.github/workflows/nitros9.sh
      

